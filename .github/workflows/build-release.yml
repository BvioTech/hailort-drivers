name: Build and Release

on:
  push:
    branches:
      - violoop
  workflow_dispatch:

jobs:
  build:
    # ubuntu-24.04-arm: glibc 2.39, required because the Rockchip kernel
    # headers (from Debian 12) contain scripts/mod/modpost compiled against
    # glibc 2.36 — ubuntu-22.04-arm (glibc 2.35) cannot run them.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download builder toolchain
        run: |
          mkdir -p build/builder
          curl -fsSL \
            "https://github.com/BvioTech/violoop-builder/releases/latest/download/aarch64-none-linux-gnu.tar.gz" \
            -o build/builder.tar.gz
          tar -xzf build/builder.tar.gz -C build/builder

      - name: Build .deb
        env:
          KERNEL_DIR: ${{ github.workspace }}/build/builder/sysroot/usr/src/linux-headers-6.1-rockchip
        run: bash scripts/build-deb.sh

      - name: Generate checksum
        working-directory: dist
        run: sha256sum *.deb > *.deb.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files-arm64
          path: |
            dist/*.deb
            dist/*.sha256
          retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files-arm64
          path: .

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.deb
            *.sha256

      - name: Notify apt repo
        env:
          SECRET: ${{ secrets.APT_WEBHOOK_SECRET }}
          HOOK_URL: https://deb.violoop.ai/hook/release
        run: |
          BODY=$(jq -cn --arg r "${{ github.repository }}" --arg t "${{ github.ref_name }}" \
            '{repo:$r, tag:$t}')
          SIG=sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $2}')
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            --data "$BODY"
